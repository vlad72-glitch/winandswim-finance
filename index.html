<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="W&S Finance">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1419">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<title>Win and Swim Finance</title>
<style>
  /* ============================================================
     Win and Swim Finance — design system
     One family (Instrument Sans), fixed rem scale, tinted neutrals,
     motion only where it reports a state change. Contrast for every
     text/background pair is >= 4.5:1 in both themes.
     ============================================================ */
  :root{
    color-scheme:dark;

    --font:"Instrument Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

    /* type scale, ratio ~1.18, fixed (product UI, not fluid) */
    --fs-2xs:.6875rem; --fs-xs:.75rem;  --fs-sm:.8125rem; --fs-base:.9375rem;
    --fs-md:1.0625rem; --fs-lg:1.25rem; --fs-xl:1.5rem;   --fs-2xl:1.875rem;

    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;

    /* motion — built-in curves are too weak; never ease-in on UI */
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-in-out:cubic-bezier(.77,0,.175,1);
    --t-fast:120ms; --t:180ms; --t-slow:240ms;

    /* Dark only, by choice — surfaces rise with elevation, neutrals tinted
       toward the accent. There is no light palette to fall back to. */
    --bg:#0b1419; --surface:#111e25; --surface-2:#16262e; --surface-3:#1d313a;
    --ink:#e8f0f4; --ink-2:#a9c0cb; --muted:#7f9ba8;
    --line:#22353f; --line-strong:#314854;
    --accent:#3bb6d8; --accent-ink:#8fd9ee; --accent-bg:#13323d; --on-accent:#04222c;
    --good:#4ecb96; --good-bg:#10312a;
    --bad:#ff8177;  --bad-bg:#36191a;
    --warn:#e0a458; --warn-bg:#33240f;
    --fill-good:#2a9d77; --fill-bad:#cf4a3e;
    --ring:#3bb6d8;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 1px 2px rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6);

    --viz-income:#3bb6d8; --viz-expense:#f08a52; --viz-profit:#4ecb96;
    --viz-muted:#6d8593; --viz-grid:#1e313a; --viz-baseline:#314854;
    --viz-text:#7f9ba8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--font); font-size:var(--fs-base); line-height:1.5;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  /* native browser surfaces follow the theme too */
  ::selection{background:var(--accent-bg);color:var(--accent-ink);}
  :where(input,textarea){caret-color:var(--accent);}
  *{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:var(--r-full);
    border:3px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-sm);}

  .page{max-width:900px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + var(--s3)) var(--s4)
            calc(env(safe-area-inset-bottom) + 96px);}
  @media (min-width:640px){ .page{padding-bottom:var(--s7);} }

  /* ---------- header ---------- */
  .app-header{display:flex;align-items:center;gap:var(--s3);
    padding:var(--s2) var(--s1) var(--s5);}
  .brand{display:flex;align-items:center;gap:var(--s2);
    font-size:var(--fs-md);font-weight:600;letter-spacing:-.015em;color:var(--ink);}
  .brand b{font-weight:600;color:var(--muted);}
  .brand-mark{width:26px;height:26px;color:var(--accent);flex-shrink:0;line-height:0;}
  .brand-mark svg{width:100%;height:100%;display:block;}
  .app-header .spacer{flex:1;}
  #who{display:flex;align-items:center;gap:var(--s2);min-width:0;}
  .brand>span{white-space:nowrap;}
  .who-email{max-width:32ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* on a phone the signed-in address is noise; the icon still logs you out */
  @media (max-width:639px){ .who-email,.who-label{display:none;} }

  /* ---------- navigation ----------
     Phone: a fixed bottom bar, like the installed app it is.
     Desktop: a segmented control at the top of the content. */
  nav.tabs{display:flex;gap:var(--s1);}
  nav.tabs button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    border:none;background:none;color:var(--muted);
    font-size:var(--fs-2xs);font-weight:600;letter-spacing:.005em;
    padding:var(--s2) 2px;border-radius:var(--r-md);position:relative;
    transition:color var(--t-fast) var(--ease-out);
  }
  nav.tabs button .icon{width:22px;height:22px;
    transition:transform var(--t) var(--ease-out);}
  nav.tabs button.active{color:var(--accent);}
  nav.tabs button.active .icon{transform:translateY(-1px);}
  nav.tabs button:active{transform:scale(.94);}
  @media (max-width:639px){
    nav.tabs{
      position:fixed;left:0;right:0;bottom:0;z-index:20;
      padding:var(--s1) var(--s2) calc(env(safe-area-inset-bottom) + var(--s1));
      background:var(--surface);
      background:color-mix(in srgb,var(--surface) 88%,transparent);
      -webkit-backdrop-filter:saturate(180%) blur(12px);
      backdrop-filter:saturate(180%) blur(12px);
      border-top:1px solid var(--line);
    }
  }
  @media (min-width:640px){
    nav.tabs{margin:0 0 var(--s5);padding:var(--s1);gap:2px;
      background:var(--surface-3);border-radius:var(--r-md);}
    nav.tabs button{flex-direction:row;gap:var(--s2);
      font-size:var(--fs-sm);padding:var(--s2) var(--s4);border-radius:var(--r-sm);}
    nav.tabs button .icon{width:16px;height:16px;}
    nav.tabs button.active{background:var(--surface);color:var(--accent);
      box-shadow:var(--shadow-sm);}
    nav.tabs button.active .icon{transform:none;}
  }
  @media (hover:hover) and (pointer:fine){
    nav.tabs button:hover{color:var(--ink-2);}
    nav.tabs button.active:hover{color:var(--accent);}
  }

  /* ---------- controls ---------- */
  button{
    font:inherit;font-weight:550;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:var(--r-sm);padding:var(--s2) var(--s4);min-height:38px;
    transition:background var(--t-fast) ease,border-color var(--t-fast) ease,
               color var(--t-fast) ease,transform var(--t-fast) var(--ease-out);
  }
  button:active{transform:scale(.97);}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  button.good{background:var(--good);border-color:var(--good);color:#fff;}
  button.ghost{background:transparent;border-color:transparent;color:var(--muted);
    padding:var(--s1) var(--s2);min-height:0;}
  button.danger{color:var(--bad);border-color:transparent;background:transparent;}
  button.small{padding:var(--s1) var(--s3);font-size:var(--fs-sm);min-height:30px;
    border-radius:7px;}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  button:disabled:active{transform:none;}
  @media (hover:hover) and (pointer:fine){
    button:hover:not(:disabled){background:var(--surface-2);border-color:var(--line-strong);}
    button.primary:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink);}
    button.good:hover:not(:disabled){filter:brightness(.92);}
    button.ghost:hover:not(:disabled){background:var(--surface-3);color:var(--ink);}
    button.danger:hover:not(:disabled){background:var(--bad-bg);border-color:transparent;}
  }
  button.icon-btn{width:30px;height:30px;min-height:0;padding:0;flex-shrink:0;}
  button.icon-btn .icon{width:15px;height:15px;}
  button.ghost .icon{width:15px;height:15px;}

  input,select,textarea{
    font:inherit;font-size:var(--fs-base);color:var(--ink);background:var(--surface);
    border:1px solid var(--line-strong);border-radius:var(--r-sm);
    padding:var(--s2) var(--s3);min-height:38px;
    transition:border-color var(--t-fast) ease,box-shadow var(--t-fast) ease;
  }
  textarea{line-height:1.5;resize:vertical;}
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:1;}
  select.small,input.small{padding:var(--s1) var(--s2);font-size:var(--fs-sm);min-height:30px;}
  input[type=checkbox]{accent-color:var(--accent);min-height:0;width:16px;height:16px;}
  .icon{display:inline-block;width:18px;height:18px;flex-shrink:0;line-height:0;}
  .icon svg{width:100%;height:100%;display:block;}

  /* ---------- surfaces ----------
     Cards group related things; they never nest inside one another. */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:var(--s5);margin-bottom:var(--s4);box-shadow:var(--shadow-sm);}
  .card h2{margin:0;font-size:var(--fs-lg);font-weight:600;letter-spacing:-.015em;
    text-wrap:balance;}
  .row{display:flex;align-items:center;gap:var(--s3);}
  .row.wrap{flex-wrap:wrap;}
  .muted{color:var(--muted);}
  .small{font-size:var(--fs-sm);}
  .tiny{font-size:var(--fs-xs);}
  .stack>*+*{margin-top:var(--s3);}
  .stack>input,.stack>select,.stack>textarea{width:100%;}
  .center{text-align:center;}
  /* more air above a heading than below it, so it binds to what it labels */
  .section-label{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;
    letter-spacing:.07em;color:var(--muted);margin:0 0 var(--s3);}
  .card>.section-label+*{margin-top:0;}
  .link{color:var(--accent);text-decoration:underline;text-underline-offset:2px;
    text-decoration-thickness:1px;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);}
  @media (hover:hover){ .link:hover{text-decoration-color:var(--accent);} }

  .err,.banner{border-radius:var(--r-md);padding:var(--s3) var(--s4);
    font-size:var(--fs-sm);display:flex;gap:var(--s2);align-items:flex-start;
    transition:opacity var(--t-slow) var(--ease-out),transform var(--t-slow) var(--ease-out);}
  .err{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-bg);
    border-color:color-mix(in srgb,var(--bad) 25%,transparent);
    margin-top:var(--s2);}
  .banner{background:var(--warn-bg);color:var(--warn);margin-bottom:var(--s3);
    border:1px solid var(--warn-bg);
    border-color:color-mix(in srgb,var(--warn) 25%,transparent);}
  .banner.ok{background:var(--good-bg);color:var(--good);
    border-color:color-mix(in srgb,var(--good) 25%,transparent);}
  @starting-style{ .err,.banner{opacity:0;transform:translateY(-4px);} }
  .empty{text-align:center;color:var(--muted);padding:var(--s7) var(--s4);
    font-size:var(--fs-sm);text-wrap:pretty;}

  /* ---------- KPI row ----------
     One panel split by hairlines rather than four floating cards. */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:var(--s4);}
  @media (min-width:640px){ .tiles{grid-template-columns:repeat(4,1fr);} }
  .tile{padding:var(--s4) var(--s4) var(--s4);
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .tile:nth-child(2n){border-right:none;}
  .tile:nth-last-child(-n+2){border-bottom:none;}
  @media (min-width:640px){
    .tile{border-bottom:none;}
    .tile:nth-child(2n){border-right:1px solid var(--line);}
    .tile:last-child{border-right:none;}
  }
  .tile .lbl{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;
    letter-spacing:.07em;color:var(--muted);}
  .tile .val{font-size:var(--fs-xl);font-weight:650;letter-spacing:-.025em;
    margin-top:var(--s1);font-variant-numeric:tabular-nums;line-height:1.15;}
  .tile .sub{font-size:var(--fs-xs);color:var(--muted);margin-top:3px;
    font-variant-numeric:tabular-nums;}
  .amt-pos{color:var(--good);}
  .amt-neg{color:var(--bad);}

  /* ---------- filters ---------- */
  .filters{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;
    margin-bottom:var(--s4);}
  .filters input[type=search]{flex:1;min-width:150px;}
  .filters label.chk{display:inline-flex;align-items:center;gap:var(--s2);
    font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;cursor:pointer;
    padding:var(--s1) var(--s2);border-radius:var(--r-sm);}
  @media (hover:hover){ .filters label.chk:hover{background:var(--surface-3);color:var(--ink);} }

  /* ---------- charts ---------- */
  .chart-box{position:relative;height:250px;}
  .chart-box.tall{height:290px;}

  /* ---------- transactions ---------- */
  .tx-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s2);
    border-bottom:1px solid var(--line);font-size:var(--fs-sm);
    border-radius:var(--r-sm);
    transition:background var(--t-fast) ease;}
  .tx-row:last-child{border-bottom:none;}
  @media (hover:hover) and (pointer:fine){ .tx-row:hover{background:var(--surface-2);} }
  .tx-date{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;
    width:78px;flex-shrink:0;font-size:var(--fs-xs);}
  .tx-main{flex:1;min-width:0;}
  .tx-name{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-desc{color:var(--muted);font-size:var(--fs-xs);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .tx-amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;
    text-align:right;width:100px;flex-shrink:0;}
  .tx-row select{max-width:150px;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-2xs);
    font-weight:650;background:var(--surface-3);color:var(--muted);
    padding:2px 8px;border-radius:var(--r-full);white-space:nowrap;
    font-variant-numeric:tabular-nums;}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  nav.tabs .badge.warn{position:absolute;top:2px;left:50%;margin-left:6px;
    padding:1px 5px;font-size:9px;}
  @media (min-width:640px){
    nav.tabs .badge.warn{position:static;margin-left:0;padding:2px 7px;font-size:var(--fs-2xs);}
  }

  /* ---------- import ---------- */
  .editline{display:flex;gap:var(--s2);align-items:center;padding:var(--s2) 0;
    border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .editline:last-child{border-bottom:none;}
  .editline input[type=text]{flex:1;min-width:110px;}

  /* ---------- tables ---------- */
  .pl-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);
    font-variant-numeric:tabular-nums;}
  .pl-table th,.pl-table td{padding:var(--s2) var(--s3);text-align:right;
    white-space:nowrap;border-bottom:1px solid var(--line);}
  .pl-table th:first-child,.pl-table td:first-child{text-align:left;}
  .pl-table thead th{color:var(--muted);font-weight:650;font-size:var(--fs-2xs);
    text-transform:uppercase;letter-spacing:.06em;
    position:sticky;top:0;background:var(--surface);z-index:1;
    border-bottom:1px solid var(--line-strong);}
  .pl-table tbody tr{transition:background var(--t-fast) ease;}
  @media (hover:hover) and (pointer:fine){ .pl-table tbody tr:hover{background:var(--surface-2);} }
  .pl-table tr.total td{font-weight:700;border-top:1.5px solid var(--line-strong);
    border-bottom:none;color:var(--ink);}
  .pl-table tr:last-child td{border-bottom:none;}
  .pl-table tr.now td{background:var(--accent-bg);}
  .pl-table td.muted{color:var(--muted);}
  .scroll-x{overflow-x:auto;overscroll-behavior-x:contain;}
  .exp-table{margin-top:var(--s2);}
  .exp-table td.share,.exp-table th.share{text-align:left;width:46%;}
  .bar-wrap{display:flex;align-items:center;gap:var(--s2);}
  .bar-track{flex:1;height:7px;min-width:36px;background:var(--surface-3);
    border-radius:var(--r-full);overflow:hidden;}
  .bar-fill{height:100%;background:var(--viz-expense);border-radius:var(--r-full);}
  .bar-pct{width:36px;text-align:right;color:var(--muted);font-size:var(--fs-xs);}

  /* ---------- pool ---------- */
  .pool-note{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--s3);
    line-height:1.55;text-wrap:pretty;max-width:68ch;}
  .pool-skip{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s1);}
  .poolrow{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;}

  /* ---------- break-even ---------- */
  .be-bar{position:relative;height:18px;background:var(--surface-3);
    border-radius:var(--r-full);overflow:hidden;}
  .be-bar.big{height:28px;border-radius:10px;}
  .be-fill{height:100%;border-radius:inherit;
    transition:width var(--t-slow) var(--ease-out);}
  .be-fill.ok{background:var(--fill-good);}
  .be-fill.short{background:var(--fill-bad);}
  .be-mark{position:absolute;top:0;bottom:0;width:2px;
    background:var(--ink-2);
    background:color-mix(in srgb,var(--ink) 62%,transparent);}
  .be-head{font-size:var(--fs-lg);font-weight:650;letter-spacing:-.02em;
    margin:0 0 var(--s3);text-wrap:balance;}
  .be-item{padding:var(--s3) 0;border-bottom:1px solid var(--line);}
  .be-item:last-child{border-bottom:none;padding-bottom:0;}
  .be-line{display:flex;justify-content:space-between;align-items:baseline;
    gap:var(--s3);font-variant-numeric:tabular-nums;margin-top:var(--s2);flex-wrap:wrap;}
  .be-line.sub>span{white-space:nowrap;}
  .be-meta{margin-top:var(--s3);}
  .note-toggle{margin-top:var(--s3);}
  .note-toggle>summary{font-size:var(--fs-xs);color:var(--muted);cursor:pointer;
    list-style:none;display:inline-flex;align-items:center;gap:5px;padding:2px 0;}
  .note-toggle>summary::-webkit-details-marker{display:none;}
  .note-toggle>summary::after{content:"";width:5px;height:5px;
    border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
    transform:rotate(45deg) translateY(-1px);
    transition:transform var(--t) var(--ease-out);}
  .note-toggle[open]>summary::after{transform:rotate(-135deg) translateY(1px);}
  @media (hover:hover){ .note-toggle>summary:hover{color:var(--ink-2);} }
  .be-line .m{font-weight:600;font-size:var(--fs-base);display:inline-flex;
    align-items:center;gap:var(--s2);}
  .be-line .g{font-weight:650;font-size:var(--fs-base);}
  .be-line.sub{font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s1);}

  /* ---------- skeleton (loading reads as shape, not a spinner) ---------- */
  .skel{background:var(--surface-3);
    background:linear-gradient(90deg,var(--surface-3) 25%,
    color-mix(in srgb,var(--surface-3) 45%,var(--surface)) 37%,var(--surface-3) 63%);
    background-size:400% 100%;border-radius:var(--r-sm);
    animation:skel 1.4s linear infinite;}
  @keyframes skel{from{background-position:100% 0;}to{background-position:0 0;}}
  .skel-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);
    overflow:hidden;margin-bottom:var(--s4);}
  @media (min-width:640px){ .skel-tiles{grid-template-columns:repeat(4,1fr);} }
  .skel-tile{background:var(--surface);padding:var(--s4);}

  @media (max-width:639px){
    /* headline figures stay inside a half-width tile even when they get long */
    .tile .val{font-size:var(--fs-lg);}
  }
  @media (max-width:560px){
    .pl-table .col-detail{display:none;}
    .pool-table th,.pool-table td,
    .exp-table th,.exp-table td{padding:var(--s2) var(--s1);font-size:var(--fs-xs);}
    /* On a phone the row wrapped but the NAME kept losing the fight to the two
       selects, so every row read "Evers…". Give the name its own line and let the
       controls share the one below. */
    .tx-row{flex-wrap:wrap;row-gap:var(--s2);gap:var(--s2);}
    .tx-date{order:1;width:auto;}
    .tx-amt{order:2;margin-left:auto;width:auto;}

    .tx-main{order:4;flex:1 1 100%;min-width:100%;}
    .tx-row select{order:5;flex:1 1 40%;max-width:none;min-width:0;}
  }

  /* Motion reports state change; it is never the point. Strip movement when asked. */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
    button:active,nav.tabs button:active{transform:none;}
  }

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- tiny DOM helper ----------
  function h(tag, props){
    var e = document.createElement(tag);
    if (props) for (var k in props){
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
      else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, "");
      else e.setAttribute(k, v);
    }
    for (var i=2;i<arguments.length;i++){
      var kid = arguments[i];
      (Array.isArray(kid) ? kid : [kid]).forEach(function(c){
        if (c == null || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      });
    }
    return e;
  }
  // ---------- icons ----------
  // Inline stroked SVG on a 24 grid. Inline because an icon font or an emoji is a
  // glyph lookup that can fail; these render identically everywhere and inherit
  // currentColor, so they follow the theme for free.
  var ICONS = {
    dashboard:'<path d="M3 21h18"/><rect x="4" y="10.5" width="4" height="7.5" rx="1.2"/>'
      + '<rect x="10" y="5" width="4" height="13" rx="1.2"/><rect x="16" y="13.5" width="4" height="4.5" rx="1.2"/>',
    pool:'<path d="M2 16.4c1.7 0 1.7-1.5 3.3-1.5s1.7 1.5 3.4 1.5 1.7-1.5 3.3-1.5 1.7 1.5 3.3 1.5 1.7-1.5 3.4-1.5"/>'
      + '<path d="M2 20.6c1.7 0 1.7-1.5 3.3-1.5s1.7 1.5 3.4 1.5 1.7-1.5 3.3-1.5 1.7 1.5 3.3 1.5 1.7-1.5 3.4-1.5"/>'
      + '<path d="M7 12.8V6.2A2.2 2.2 0 0 1 11.4 6"/><path d="M16.6 12V6.2A2.2 2.2 0 0 0 12.2 6"/><path d="M7 9.4h9.6"/>',
    transactions:'<path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12"/>'
      + '<path d="M3.6 6.5h.01M3.6 12h.01M3.6 17.5h.01"/>',
    settings:'<path d="M4 7h9M18.5 7H20M4 17h2.5M11.5 17H20"/>'
      + '<circle cx="15.7" cy="7" r="2.4"/><circle cx="9" cy="17" r="2.4"/>',
    analytics:'<path d="M3.5 3v16A1.5 1.5 0 0 0 5 20.5h15.5"/><path d="M7 15.5l4-4.8 3.3 2.9L20.5 7"/>',
    close:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    edit:'<path d="M4.5 19.5h4L19 9a2.12 2.12 0 0 0-3-3L5.5 16.5v3Z"/><path d="M14.5 7.5 17.5 10.5"/>',
    plus:'<path d="M12 5.5v13M5.5 12h13"/>',
    logout:'<path d="M9.5 20.5h-3a2.5 2.5 0 0 1-2.5-2.5v-12a2.5 2.5 0 0 1 2.5-2.5h3"/>'
      + '<path d="M16 16.5l4.5-4.5L16 7.5M20.5 12H9.5"/>'
  };
  function icon(name, cls){
    var e = document.createElement("span");
    e.className = "icon" + (cls ? " " + cls : "");
    e.setAttribute("aria-hidden", "true");
    e.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"'
      + ' stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || "") + '</svg>';
    return e;
  }

  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
  function debounce(fn, ms){ var t; return function(){ clearTimeout(t); t=setTimeout(fn, ms); }; }
  var APP = document.getElementById("app");
  var WHO = document.getElementById("who");

  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var eurFmt = new Intl.NumberFormat("nl-NL", { style:"currency", currency:"EUR" });
  function fmtEUR(cents){ return eurFmt.format(cents / 100); }
  function fmtDate(iso){
    if (!iso) return "";
    var p = String(iso).split("-");
    return p.length === 3 ? p[2] + " " + MONTHS[Number(p[1])-1] + " " + p[0].slice(2) : iso;
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }

  // ---------- chart palette (validated with the dataviz palette validator) ----------
  var VIZ = {
    income:"#0b6e88", expense:"#cf5a22", profit:"#0b6e4f",
    muted:"#6d8593", grid:"#1e313a", baseline:"#314854", text:"#7f9ba8", surface:"#111e25",
    slots:["#0b6e88","#1a9e74","#c98a00","#2f7d32","#5b4bb8","#cf4b43","#c2688f","#cf5a22"],
    uncategorized:"#7e97a4", other:"#c3d1da"
  };
  // Re-read the chart roles from CSS on every render so light and dark stay in step
  // with the rest of the page instead of drifting into their own palette.
  function readViz(){
    var cs = getComputedStyle(document.documentElement);
    ["income","expense","profit","muted","grid","baseline","text"].forEach(function(k){
      var v = cs.getPropertyValue("--viz-" + k).trim();
      if (v) VIZ[k] = v;
    });
    var sf = cs.getPropertyValue("--surface").trim();
    if (sf) VIZ.surface = sf;
  }

  // ---------- config / client ----------
  var cfg = window.WSFIN_CONFIG || {};
  var configured = cfg.url && cfg.anonKey && cfg.url.indexOf("YOUR-") === -1 && cfg.anonKey.indexOf("YOUR-") === -1;
  var sb = null;
  if (configured && window.supabase) sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  // ---------- state ----------
  var session = null;
  var data = { categories:[], rules:[], transactions:[] };
  var view = { name:"dashboard" };
  var now = new Date();
  var filters = { year: now.getFullYear(), month: null, categoryId: "", search: "", uncategorizedOnly: false };
  var txLimit = 100;
  var charts = {};
  var loginError = "";
  var addingManual = false;
  var editingTxId = null;

  function nav(name){
    view = { name:name };
    txLimit = 100;
    render();
  }

  // ---------- data helpers ----------
  // A transaction counts in the month of report_date when set (invoices paid
  // in a different month than the one they cover), else its booking date.
  function txDate(t){ return t.report_date || t.booking_date; }
  function shiftMonthISO(iso, shift){
    var y = Number(iso.slice(0,4)), m = Number(iso.slice(5,7)) - 1 + shift, d = Number(iso.slice(8,10));
    var ny = y + Math.floor(m / 12), nm = ((m % 12) + 12) % 12;
    var last = new Date(ny, nm + 1, 0).getDate();
    return ny + "-" + String(nm + 1).padStart(2, "0") + "-" + String(Math.min(d, last)).padStart(2, "0");
  }
  function monthDiff(a, b){
    return (Number(b.slice(0,4)) - Number(a.slice(0,4))) * 12 + (Number(b.slice(5,7)) - Number(a.slice(5,7)));
  }
  function catById(id){ return data.categories.find(function(c){ return c.id === id; }) || null; }
  function catName(id){ var c = catById(id); return c ? c.name : "Uncategorized"; }
  // Categories flagged exclude_from_pl (transfers, loans, card-processor payouts that
  // settle income counted elsewhere) are shown in lists but never hit profit math.
  function catExcluded(id){ var c = catById(id); return !!(c && c.exclude_from_pl); }
  function inPL(t){ return !catExcluded(t.category_id); }
  // Flag rows that need a human decision after import: uncategorized, or a Friendship
  // pool invoice whose covered month isn't set yet (pool bills are paid with a variable lag).
  function needsReview(t){
    if (t.category_id == null) return true;
    var c = catById(t.category_id);
    if (c && c.name === "Pool rental" && /friendship/i.test(t.counterparty_name || "") && !t.report_date) return true;
    return false;
  }
  function sortedCats(){
    return data.categories.slice().sort(function(a,b){
      var ra = a.exclude_from_pl ? 2 : a.kind==="income" ? 0 : 1;
      var rb = b.exclude_from_pl ? 2 : b.kind==="income" ? 0 : 1;
      return ra - rb || a.sort_order - b.sort_order || a.id - b.id;
    });
  }
  // color follows the category id (stable across filters), never its rank in a chart
  function catColor(id){
    if (id == null) return VIZ.uncategorized;
    var ids = data.categories.map(function(c){ return c.id; }).sort(function(a,b){ return a-b; });
    var i = ids.indexOf(id);
    return i === -1 ? VIZ.other : VIZ.slots[i % VIZ.slots.length];
  }
  function txYears(){
    var ys = {};
    data.transactions.forEach(function(t){ ys[Number(txDate(t).slice(0,4))] = true; });
    ys[now.getFullYear()] = true;
    return Object.keys(ys).map(Number).sort(function(a,b){ return b-a; });
  }

  // ---------- money parsing ----------
  // Rabobank "Bedrag": "+1.234,56" / "-12,50" (decimal comma, optional thousands dots)
  function parseUserAmount(s){
    s = String(s == null ? "" : s).trim().replace(/[€\s]/g, "");
    if (!s) return null;
    var lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");
    var dec = Math.max(lastComma, lastDot);
    var intPart, fracPart;
    if (dec === -1){ intPart = s; fracPart = ""; }
    else {
      // rightmost separator is the decimal one only if followed by 1-2 digits
      fracPart = s.slice(dec + 1);
      if (/^\d{1,2}$/.test(fracPart)){ intPart = s.slice(0, dec); }
      else { intPart = s; fracPart = ""; }
    }
    intPart = intPart.replace(/[.,]/g, "");
    if (!/^\d+$/.test(intPart)) return null;
    return Number(intPart) * 100 + (fracPart ? Number((fracPart + "00").slice(0,2)) : 0);
  }
  // ---------- month helpers ----------
  function monthLabel(ym){ return MONTHS[Number(ym.slice(5,7)) - 1] + " " + ym.slice(0,4); }
  function monthShort(ym){ return MONTHS[Number(ym.slice(5,7)) - 1] + " '" + ym.slice(2,4); }
  // ---------- rule engine ----------
  function sortedRules(){
    return data.rules.slice().sort(function(a,b){ return a.priority - b.priority || a.id - b.id; });
  }
  function matchRule(tx, rules){
    for (var i=0;i<rules.length;i++){
      var r = rules[i];
      var hay = (r.match_field === "counterparty" ? tx.counterparty_name
              : r.match_field === "description" ? tx.description
              : tx.counterparty_name + " " + tx.description).toLowerCase();
      if (r.keyword && hay.indexOf(r.keyword.toLowerCase()) !== -1) return r;
    }
    return null;
  }
  function ruleReportDate(tx, r){
    return (r && r.shift_months) ? shiftMonthISO(tx.booking_date, r.shift_months) : null;
  }

  // ---------- aggregations ----------
  function txInYear(year){
    var y = String(year);
    return data.transactions.filter(function(t){ return txDate(t).slice(0,4) === y; });
  }
  function totals(txs){
    var income = 0, expense = 0;
    txs.forEach(function(t){
      if (!inPL(t)) return;
      if (t.amount_cents > 0) income += t.amount_cents; else expense += -t.amount_cents;
    });
    var profit = income - expense;
    return { income:income, expense:expense, profit:profit, margin: income > 0 ? (profit/income)*100 : null };
  }
  // expense totals per category, sorted desc, tail beyond 7 folded into "Other"
  function categoryBreakdown(txs){
    var by = {};
    txs.forEach(function(t){
      if (t.amount_cents >= 0 || !inPL(t)) return;
      var k = t.category_id == null ? "null" : String(t.category_id);
      by[k] = (by[k] || 0) + (-t.amount_cents);
    });
    var items = Object.keys(by).map(function(k){
      return { categoryId: k === "null" ? null : Number(k),
               label: k === "null" ? "Uncategorized" : catName(Number(k)),
               total: by[k] };
    }).sort(function(a,b){ return b.total - a.total; });
    if (items.length > 8){
      var head = items.slice(0,7);
      var rest = items.slice(7).reduce(function(s,x){ return s + x.total; }, 0);
      head.push({ categoryId:"other", label:"Other", total:rest });
      return head;
    }
    return items;
  }
  // Full (uncollapsed) expense breakdown for a set of transactions — every category, biggest first.
  function expenseBreakdownFull(txs){
    var by = {};
    txs.forEach(function(t){
      if (t.amount_cents >= 0 || !inPL(t)) return;
      var k = t.category_id == null ? "null" : String(t.category_id);
      by[k] = (by[k] || 0) + (-t.amount_cents);
    });
    return Object.keys(by).map(function(k){
      return { label: k === "null" ? "Uncategorized" : catName(Number(k)), total: by[k] };
    }).sort(function(a,b){ return b.total - a.total; });
  }
  // Readable expense table (Expense | Amount | Share-bar) for the selected period — reads top-to-bottom, no side scroll.
  function expenseTable(txs){
    var items = expenseBreakdownFull(txs);
    if (!items.length) return h("div",{class:"empty"},"No expenses in this period.");
    var grand = items.reduce(function(s,x){ return s + x.total; }, 0);
    return h("table",{class:"pl-table exp-table"},
      h("thead",null,h("tr",null,
        h("th",null,"Expense"), h("th",null,"Amount"), h("th",{class:"share"},"Share"))),
      h("tbody",null,
        items.map(function(x){
          var pct = grand ? x.total / grand * 100 : 0;
          return h("tr",null,
            h("td",null, x.label),
            h("td",null, fmtEUR(x.total)),
            h("td",{class:"share"}, h("div",{class:"bar-wrap"},
              h("div",{class:"bar-track"}, h("div",{class:"bar-fill", style:"width:" + pct.toFixed(1) + "%"})),
              h("span",{class:"bar-pct"}, pct.toFixed(0) + "%"))));
        }),
        h("tr",{class:"total"},
          h("td",null,"Total"),
          h("td",null, fmtEUR(grand)),
          h("td",{class:"share"},""))
      ));
  }

  // ---------- pool rent estimator ----------
  // Source of truth: "Bijlage 2" of the Gebruikersovereenkomst with Stichting Friendship
  // Sports Centre (signed 27-08-2026, sportjaar 2026/2027). Its tariffs are per lane per
  // hour and EXCLUDE btw. The contract's own "Bedrag" column is exactly lanes x hours x
  // the per-lane rate (Mon/Thu 2 x EUR 56,20 = EUR 112,40; Sat 2h = EUR 224,80), so the
  // estimate below reproduces the contract line for line.
  var POOL_KEY = "wsfin.pool.v1";
  var DOW_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var POOL_CONTRACT = {
    season: "2026 / 2027",
    pool: "Wedstrijdbad",
    start: "2026-09-03",          // donderdag 03 september 2026
    end:   "2027-07-11",          // zondag 11 juli 2027
    laneRateCents: 5620,          // EUR 56,20 per baan per uur, excl. btw (geindexeerd)
    vatPct: 9,                    // bijlage tariffs are excl. btw; Friendship invoices add 9% (confirmed by Vlad, Sep 2026)
    slots: [
      { dow:1, time:"18:30–19:30", hours:1, lanes:2, ref:"22157" },
      { dow:4, time:"19:30–20:30", hours:1, lanes:2, ref:"22155" },
      { dow:6, time:"16:00–18:00", hours:2, lanes:2, ref:"22156" }
    ],
    // School holidays are swum through — except the Christmas break, which is struck out
    // in the bijlage's "wordt er wel gezwommen" list.
    breaks: [
      { from:"2026-12-19", to:"2027-01-03", label:"Kerstvakantie — no swimming" }
    ],
    // Days the centre itself is shut.
    closed: [
      { date:"2026-12-25", label:"1e kerstdag" },
      { date:"2026-12-26", label:"2e kerstdag" },
      { date:"2027-01-01", label:"Nieuwjaarsdag" },
      { date:"2027-03-28", label:"1e Paasdag" },
      { date:"2027-03-29", label:"2e Paasdag" },
      { date:"2027-04-27", label:"Koningsdag" },
      { date:"2027-05-06", label:"Hemelvaartsdag" },
      { date:"2027-05-16", label:"1e Pinksterdag" },
      { date:"2027-05-17", label:"2e Pinksterdag" }
    ],
    // Holidays we DO swim through — reference only, they cost the normal rate.
    swimHolidays: [
      { from:"2026-10-10", to:"2026-10-18", label:"Herfstvakantie" },
      { from:"2027-02-20", to:"2027-02-28", label:"Voorjaarsvakantie" },
      { from:"2027-04-24", to:"2027-05-02", label:"Meivakantie" },
      { from:"2027-07-10", to:"2027-08-22", label:"Zomervakantie" }
    ]
  };

  var poolCfg = null, poolEditing = false;
  function poolClone(o){ return JSON.parse(JSON.stringify(o)); }
  function getPoolCfg(){
    if (poolCfg) return poolCfg;
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(POOL_KEY) || "null"); } catch(e){}
    poolCfg = (saved && saved.start && saved.end && saved.slots && saved.slots.length)
      ? saved : poolClone(POOL_CONTRACT);
    return poolCfg;
  }
  function savePoolCfg(){ try { localStorage.setItem(POOL_KEY, JSON.stringify(poolCfg)); } catch(e){} }
  function resetPoolCfg(){
    poolCfg = poolClone(POOL_CONTRACT);
    try { localStorage.removeItem(POOL_KEY); } catch(e){}
  }
  function poolCustomised(){ try { return !!localStorage.getItem(POOL_KEY); } catch(e){ return false; } }

  function poolVat(cfg){ return Math.max(0, Number(cfg.vatPct) || 0); }
  function poolGross(cents, cfg){ return cents + Math.round(cents * poolVat(cfg) / 100); }
  function slotNet(s, cfg){
    return Math.round((Number(s.hours)||0) * (Number(s.lanes)||0) * (Number(cfg.laneRateCents)||0));
  }
  function poolWeekNet(cfg){
    return (cfg.slots || []).reduce(function(sum, s){ return sum + slotNet(s, cfg); }, 0);
  }

  // Walk the season one day at a time: a day is billed when it matches a booked slot and
  // falls neither inside a no-swim break nor on the centre's closed list.
  function poolPlan(cfg){
    var out = { months:[], byMonth:{}, skipped:[], totalNet:0, totalHours:0, totalSessions:0 };
    var t = Date.parse(cfg.start + "T00:00:00Z"), endT = Date.parse(cfg.end + "T00:00:00Z");
    if (isNaN(t) || isNaN(endT) || t > endT) return out;
    for (var guard = 0; t <= endT && guard < 2000; t += 86400000, guard++){
      var d = new Date(t), iso = d.toISOString().slice(0,10), dow = d.getUTCDay();
      var slots = (cfg.slots || []).filter(function(s){ return Number(s.dow) === dow; });
      if (!slots.length) continue;
      var brk  = (cfg.breaks || []).filter(function(b){ return iso >= b.from && iso <= b.to; })[0];
      var shut = (cfg.closed || []).filter(function(c){ return c.date === iso; })[0];
      if (brk || shut){
        out.skipped.push({ date:iso, dow:dow, kind: brk ? "break" : "closed",
                           why: brk ? brk.label : (shut.label || "centre closed"),
                           savedCents: slots.reduce(function(s,x){ return s + slotNet(x, cfg); }, 0) });
        continue;
      }
      var ym = iso.slice(0,7), m = out.byMonth[ym];
      if (!m){ m = out.byMonth[ym] = { ym:ym, perDow:{}, sessions:0, hours:0, netCents:0 }; out.months.push(m); }
      slots.forEach(function(s){
        m.perDow[dow] = (m.perDow[dow] || 0) + 1;
        m.sessions++;
        m.hours += Number(s.hours) || 0;
        m.netCents += slotNet(s, cfg);
        out.totalSessions++;
        out.totalHours += Number(s.hours) || 0;
        out.totalNet += slotNet(s, cfg);
      });
    }
    out.months.sort(function(a,b){ return a.ym < b.ym ? -1 : 1; });
    return out;
  }

  function poolCategoryIds(){
    return data.categories.filter(function(c){
      return c.kind === "expense" && /pool|zwembad|baanhuur/i.test(c.name);
    }).map(function(c){ return c.id; });
  }
  // What the pool has actually cost, by the month each invoice counts in (report_date).
  function poolActualByMonth(){
    var ids = poolCategoryIds();
    var out = {};
    if (!ids.length) return out;
    data.transactions.forEach(function(t){
      if (ids.indexOf(t.category_id) === -1) return;
      var ym = txDate(t).slice(0,7);
      out[ym] = (out[ym] || 0) + (-t.amount_cents);
    });
    return out;
  }

  // Closed days / breaks round-trip through plain text so they stay editable without SQL.
  function poolClosedToText(list){
    return (list || []).map(function(c){ return c.date + "  " + (c.label || ""); }).join("\n");
  }
  function poolTextToClosed(s){
    return String(s).split(/\r?\n/).map(function(l){
      var m = l.trim().match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/);
      return m ? { date:m[1], label:m[2].trim() } : null;
    }).filter(Boolean);
  }
  function poolBreaksToText(list){
    return (list || []).map(function(b){ return b.from + ".." + b.to + "  " + (b.label || ""); }).join("\n");
  }
  function poolTextToBreaks(s){
    return String(s).split(/\r?\n/).map(function(l){
      var m = l.trim().match(/^(\d{4}-\d{2}-\d{2})\s*\.\.\s*(\d{4}-\d{2}-\d{2})\s*(.*)$/);
      return m ? { from:m[1], to:m[2], label:m[3].trim() } : null;
    }).filter(Boolean);
  }

  // ---------- break-even tracker ----------
  // "Is the revenue keeping up with what this costs?" The pool half of the answer is known
  // months before the invoice arrives, so a month's pool cost is the real invoice once it
  // has landed and the contract estimate until then — never both, so a late invoice can't
  // double-count. Everything else is what has actually been booked to that month.
  function breakEven(year){
    var cfg = getPoolCfg(), plan = poolPlan(cfg), poolIds = poolCategoryIds();
    var y = String(year), rows = {};
    function row(ym){
      return rows[ym] || (rows[ym] = { ym:ym, revenue:0, other:0, poolActual:0, poolEst:0 });
    }
    data.transactions.forEach(function(t){
      if (!inPL(t)) return;
      var ym = txDate(t).slice(0,7);
      if (ym.slice(0,4) !== y) return;
      var r = row(ym);
      if (t.amount_cents >= 0) r.revenue += t.amount_cents;
      else if (poolIds.indexOf(t.category_id) > -1) r.poolActual += -t.amount_cents;
      else r.other += -t.amount_cents;
    });
    plan.months.forEach(function(m){
      if (m.ym.slice(0,4) === y) row(m.ym).poolEst = poolGross(m.netCents, cfg);
    });
    return Object.keys(rows).sort().map(function(ym){
      var r = rows[ym];
      r.estimated = r.poolActual <= 0 && r.poolEst > 0;
      r.pool  = r.poolActual > 0 ? r.poolActual : r.poolEst;
      r.costs = r.pool + r.other;
      r.gap   = r.revenue - r.costs;
      return r;
    }).filter(function(r){ return r.revenue || r.costs; });
  }

  // Revenue fills the bar; the notch is break-even. Both are scaled to whichever is bigger,
  // so a month that clears its costs shows the notch sitting inside a full green bar.
  // Explanations live behind a toggle rather than on the screen: the numbers are
  // what you read every day, the reasoning is what you read once.
  function noteToggle(label, lines){
    var d = h("details",{class:"note-toggle"}, h("summary",null,label));
    lines.filter(Boolean).forEach(function(t){ d.append(h("div",{class:"pool-note"}, t)); });
    return d;
  }

  function beBar(revenue, costs, big){
    var max = Math.max(revenue, costs, 1);
    var ok = revenue >= costs;
    return h("div",{class:"be-bar" + (big ? " big" : "")},
      h("div",{class:"be-fill " + (ok ? "ok" : "short"),
               style:{ width: Math.min(100, revenue / max * 100).toFixed(1) + "%" }}),
      h("div",{class:"be-mark", style:{ left: Math.min(100, costs / max * 100).toFixed(1) + "%" }}));
  }

  // ---------- supabase calls ----------
  async function fetchAllTransactions(){
    var all = [], from = 0, page = 1000;
    for(;;){
      var r = await sb.from("transactions").select("*")
        .order("booking_date", { ascending:false }).order("id", { ascending:false })
        .range(from, from + page - 1);
      if (r.error) throw r.error;
      all = all.concat(r.data || []);
      if (!r.data || r.data.length < page) break;
      from += page;
    }
    return all;
  }
  async function loadAll(){
    if (!sb || !session) return;
    var res = await Promise.all([
      sb.from("categories").select("*"),
      sb.from("rules").select("*")
    ]);
    var firstErr = res.find(function(r){ return r.error; });
    if (firstErr) throw firstErr.error;
    data.categories = res[0].data || [];
    data.rules = res[1].data || [];
    data.transactions = await fetchAllTransactions();
  }

  var refreshing = false;
  async function refresh(){
    if (!sb || !session || refreshing) return;
    var ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT")) return;
    refreshing = true;
    try{ await loadAll(); render(); }
    catch(e){ console.warn("refresh failed", e); }
    finally{ refreshing = false; }
  }

  async function mutate(promiseFactory){
    if (!session){ alert("You are logged out."); return false; }
    try{
      var r = await promiseFactory();
      if (r && r.error) throw r.error;
      await loadAll();
      render();
      return r;
    }catch(e){
      alert("Couldn't save: " + (e.message || e));
      return false;
    }
  }

  }

    return mutate(function(){ return sb.from("transactions").update({ report_date: reportDate }).eq("id", id); });
  }
  function deleteTx(id){

  }

  async function applyRulesToUncategorized(){
    var rules = sortedRules();
    var plain = {};      // categoryId -> [txId] (rules without a month shift, batched)
    var shifted = [];    // per-transaction updates when the rule shifts the month
    data.transactions.forEach(function(t){
      if (t.category_id != null) return;
      var r = matchRule(t, rules);
      if (!r) return;
      if (r.shift_months){
        shifted.push({ id: t.id, category_id: r.category_id, report_date: ruleReportDate(t, r) });
      } else {
        (plain[r.category_id] = plain[r.category_id] || []).push(t.id);
      }
    });
    var cids = Object.keys(plain);
    var n = shifted.length + cids.reduce(function(s,k){ return s + plain[k].length; }, 0);
    if (!n){ alert("No uncategorized transactions matched any rule."); return; }
    await mutate(function(){
      var calls = cids.map(function(cid){
        return sb.from("transactions").update({ category_id: Number(cid) }).in("id", plain[cid]);
      }).concat(shifted.map(function(u){
        return sb.from("transactions").update({ category_id: u.category_id, report_date: u.report_date }).eq("id", u.id);
      }));
      return Promise.all(calls).then(function(rs){ return rs.find(function(r){ return r.error; }) || { error:null }; });
    });
    alert("Categorized " + n + " transaction" + (n===1?"":"s") + " using your rules.");
  }

  // ----- analytics -----
  // Deliberately no date picker: this tab is the whole history in one run, so months
  // can be read against each other across years without switching anything.
  function renderAnalytics(){
    var seen = {};
    data.transactions.forEach(function(t){ if (inPL(t)) seen[txDate(t).slice(0,7)] = true; });
    var months = Object.keys(seen).sort();
    if (!months.length){
      APP.append(h("div",{class:"card empty"},"Nothing to analyse yet."));
      return;
    }

    var byMonth = {};
    months.forEach(function(ym){ byMonth[ym] = { income:0, expense:0 }; });
    data.transactions.forEach(function(t){
      if (!inPL(t)) return;
      var m = byMonth[txDate(t).slice(0,7)];
      if (!m) return;
      if (t.amount_cents > 0) m.income += t.amount_cents; else m.expense += -t.amount_cents;
    });
    function marginOf(income, profit){ return income > 0 ? (profit / income) * 100 : null; }
    function moneyRow(label, income, expense, cls){
      var profit = income - expense, mg = marginOf(income, profit);
      return h("tr", cls ? {class:cls} : null,
        h("td",null, label),
        h("td",null, fmtEUR(income)),
        h("td",null, fmtEUR(expense)),
        h("td",{class: profit >= 0 ? "amt-pos" : "amt-neg"}, fmtEUR(profit)),
        h("td",null, mg == null ? "—" : mg.toFixed(1) + "%"));
    }

    // income vs expenses + profit, one shared EUR axis, across every month on record
    APP.append(h("div",{class:"card"},
      h("div",{class:"section-label"},"Income vs expenses per month"),
      h("div",{class:"chart-box tall"}, h("canvas",{id:"chart-monthly"}))));

    var tIn = 0, tOut = 0;
    months.forEach(function(ym){ tIn += byMonth[ym].income; tOut += byMonth[ym].expense; });
    APP.append(h("div",{class:"card"},
      h("div",{class:"section-label"},"Month by month"),
      h("div",{class:"scroll-x"},
        h("table",{class:"pl-table"},
          h("thead",null,h("tr",null,
            h("th",null,"Month"), h("th",null,"Income"), h("th",null,"Expenses"),
            h("th",null,"Profit"), h("th",null,"Margin"))),
          h("tbody",null,
            months.map(function(ym){
              var m = byMonth[ym];
              return moneyRow(monthLabel(ym), m.income, m.expense);
            }),
            moneyRow("All time", tIn, tOut, "total"))))));

    // ---- where the money goes: category x month, whole history ----
    var rowsByCat = {};
    data.transactions.forEach(function(t){
      if (t.amount_cents >= 0 || !inPL(t)) return;
      var ym = txDate(t).slice(0,7);
      var key = t.category_id == null ? "u" : String(t.category_id);
      var r = rowsByCat[key] || (rowsByCat[key] = {
        label: t.category_id == null ? "Uncategorized" : catName(t.category_id),
        months: {}, total: 0 });
      r.months[ym] = (r.months[ym] || 0) + (-t.amount_cents);
      r.total += -t.amount_cents;
    });
    var catRows = Object.keys(rowsByCat).map(function(k){ return rowsByCat[k]; })
      .sort(function(a,b){ return b.total - a.total; });
    if (!catRows.length) return;
    var expMonths = months.filter(function(ym){
      return catRows.some(function(r){ return r.months[ym]; });
    });
    var grand = catRows.reduce(function(sum,r){ return sum + r.total; }, 0);
    APP.append(h("div",{class:"card"},
      h("div",{class:"section-label"},"Where the money goes — expenses per source"),
      h("div",{class:"scroll-x"},
        h("table",{class:"pl-table"},
          h("thead",null,h("tr",null,
            h("th",null,"Expense source"),
            expMonths.map(function(ym){ return h("th",null, monthShort(ym)); }),
            h("th",null,"Total"), h("th",null,"%"))),
          h("tbody",null,
            catRows.map(function(r){
              return h("tr",null,
                h("td",null, r.label),
                expMonths.map(function(ym){
                  return h("td",null, r.months[ym] ? fmtEUR(r.months[ym]) : "·"); }),
                h("td",null, fmtEUR(r.total)),
                h("td",null, grand ? (r.total / grand * 100).toFixed(1) + "%" : "—"));
            }),
            h("tr",{class:"total"},
              h("td",null,"Total"),
              expMonths.map(function(ym){
                return h("td",null, fmtEUR(catRows.reduce(function(sum,r){
                  return sum + (r.months[ym] || 0); }, 0)));
              }),
              h("td",null, fmtEUR(grand)),
              h("td",null,"100%")))))));

    drawMonthlyChart(months, byMonth);
  }

  function filteredTx(){
    var y = String(filters.year), q = filters.search.trim().toLowerCase();
    return data.transactions.filter(function(t){
      if (txDate(t).slice(0,4) !== y) return false;
      if (filters.month != null && Number(txDate(t).slice(5,7)) - 1 !== filters.month) return false;
      if (filters.uncategorizedOnly && t.category_id != null) return false;
      if (filters.categoryId !== ""){
        if (filters.categoryId === "none"){ if (t.category_id != null) return false; }
        else if (t.category_id !== Number(filters.categoryId)) return false;
      }
      if (q && (t.counterparty_name + " " + t.description).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  // ----- break-even card (dashboard) -----
  // Deliberately scoped to months that have actually happened. Pool bills run 1-3 months
  // late, so the plain Profit tile flatters recent months by simply missing them; this card
  // fills those gaps from the contract estimate and says so. Months still in the future are
  // a planning question, not a performance one — they live on the Pool tab.
  function breakEvenCard(){
    var all = breakEven(filters.year);
    if (!all.length) return null;
    var nowYm = todayISO().slice(0,7);
    var done  = all.filter(function(r){ return r.ym <= nowYm; });
    var ahead = all.filter(function(r){ return r.ym >  nowYm; });
    var forecast = !done.length;            // a season year that hasn't started yet
    var base = forecast ? all : done;

    var scope, lbl;
    if (filters.month == null){
      scope = base;
      lbl = String(filters.year) + (forecast ? " (forecast)" : (ahead.length ? " so far" : ""));
    } else {
      scope = all.filter(function(r){ return Number(r.ym.slice(5,7)) - 1 === filters.month; });
      lbl = MONTHS[filters.month] + " " + filters.year +
            (scope.length && scope[0].ym > nowYm ? " (forecast)" : "");
    }
    if (!scope.length) return null;

    function sum(f){ return scope.reduce(function(s,r){ return s + f(r); }, 0); }
    var revenue  = sum(function(r){ return r.revenue; });
    var costs    = sum(function(r){ return r.costs; });
    var pool     = sum(function(r){ return r.pool; });
    var other    = sum(function(r){ return r.other; });
    var stillEst = sum(function(r){ return r.estimated ? r.poolEst : 0; });
    var gap = revenue - costs, ok = gap >= 0;
    var pct = costs ? revenue / costs * 100 : null;

    var card = h("div",{class:"card"},
      h("div",{class:"section-label"},"On target? — " + lbl),
      h("div",{class:"be-head " + (ok ? "amt-pos" : "amt-neg")},
        ok ? "On target — " + fmtEUR(gap) + " above break-even"
           : "Short by " + fmtEUR(-gap)),
      beBar(revenue, costs, true),
      h("div",{class:"be-line sub"},
        h("span",null,"revenue " + fmtEUR(revenue)),
        h("span",null,"break-even " + fmtEUR(costs) +
          (pct == null ? "" : " · " + pct.toFixed(0) + "%"))));

    // one badge carries the only caveat that changes how you read the figure
    if (stillEst)
      card.append(h("div",{class:"be-meta"},
        h("span",{class:"badge"}, fmtEUR(stillEst) + " pool estimated")));

    var running = scope.filter(function(r){ return r.ym === nowYm; }).length;
    var aheadCost = ahead.reduce(function(s,r){ return s + r.costs; }, 0);
    card.append(noteToggle("How this is worked out", [
      "Break-even " + fmtEUR(costs) + " = pool " + fmtEUR(pool) + " + " + fmtEUR(other) +
        " of other costs booked.",
      stillEst && fmtEUR(stillEst) + " of the pool figure is the contract estimate for lanes " +
        "already swum whose invoice hasn't arrived. The profit tile doesn't count it yet, which " +
        "is why this reads " + fmtEUR(stillEst) + " worse — this is the truer number.",
      running && (monthLabel(nowYm) + " is still running, so it carries only the bills booked " +
        "so far and its break-even line will still move up."),
      (filters.month == null && ahead.length && !forecast) &&
        ("Still ahead in " + filters.year + ": " + fmtEUR(aheadCost) + " of pool time across " +
         ahead.length + " more month" + (ahead.length > 1 ? "s" : "") + " — see the Pool tab.")
    ]));

    return card;
  }

  // ----- pool -----
  function renderPool(){
    var cfg  = getPoolCfg();
    var plan = poolPlan(cfg);
    var vat  = poolVat(cfg);
    var actual = poolActualByMonth();
    var thisYm = todayISO().slice(0,7);

    // weekday columns follow the booked slots, Monday first
    var dows = [];
    (cfg.slots || []).forEach(function(s){
      var d = Number(s.dow);
      if (dows.indexOf(d) === -1) dows.push(d);
    });
    dows.sort(function(a,b){ return ((a+6)%7) - ((b+6)%7); });

    var seasonNet   = plan.totalNet;
    // sum the month rows rather than grossing up the season net, so btw rounding
    // can never leave the table's total off by a cent from its own rows
    var seasonGross = plan.months.reduce(function(s,m){ return s + poolGross(m.netCents, cfg); }, 0);
    var invoiced    = plan.months.reduce(function(s,m){ return s + (actual[m.ym] || 0); }, 0);
    var thisMonth   = plan.byMonth[thisYm];
    // Bills run 1-3 months late, so "still to come" is the whole season minus whatever
    // has already been invoiced — not just the months that are still in the future.
    var ahead = seasonGross - invoiced;

    function tile(lbl, val, cls, sub){
      return h("div",{class:"tile"},
        h("div",{class:"lbl"}, lbl),
        h("div",{class:"val " + (cls || "")}, val),
        h("div",{class:"sub"}, sub));
    }
    APP.append(h("div",{class:"tiles"},
      tile("This month", thisMonth ? fmtEUR(poolGross(thisMonth.netCents, cfg)) : "—",
        "", thisMonth ? monthLabel(thisYm) + " · " + thisMonth.sessions + " sessions · " + thisMonth.hours + "h"
                      : "outside the season"),
      tile("Season total", fmtEUR(seasonGross), "",
        plan.totalHours + " pool hours · " + plan.totalSessions + " sessions"),
      tile("Invoiced so far", fmtEUR(invoiced), "",
        invoiced ? "booked to season months" : "no pool invoices booked yet"),
      tile("Still to come", fmtEUR(ahead), "",
        "season total minus invoiced")
    ));

    if (!plan.months.length){
      APP.append(h("div",{class:"card empty"},
        "No pool sessions fall inside the season dates. Check the season settings below."));
      APP.append(renderPoolEditor(cfg));
      return;
    }

    // ---- what we book every week ----
    var weekNet = poolWeekNet(cfg);
    var sched = h("table",{class:"pl-table pool-table"},
      h("thead",null,h("tr",null,
        h("th",null,"Day"), h("th",null,"Time"), h("th",{class:"col-detail"},"Lanes"),
        h("th",{class:"col-detail"},"Hours"), h("th",null,"Per session"))),
      h("tbody",null,
        (cfg.slots || []).map(function(s){
          return h("tr",null,
            h("td",null, DOW_NAMES[Number(s.dow)]),
            h("td",null, s.time || "—"),
            h("td",{class:"col-detail"}, String(s.lanes)),
            h("td",{class:"col-detail"}, String(s.hours)),
            h("td",null, fmtEUR(poolGross(slotNet(s, cfg), cfg))));
        }),
        h("tr",{class:"total"},
          h("td",null,"Full week"),
          h("td",null,""), h("td",{class:"col-detail"},""),
          h("td",{class:"col-detail"}, String((cfg.slots||[]).reduce(function(s,x){ return s + (Number(x.hours)||0); }, 0))),
          h("td",null, fmtEUR(poolGross(weekNet, cfg))))
      ));
    var refs = (cfg.slots || []).map(function(s){ return s.ref; }).filter(Boolean);
    APP.append(h("div",{class:"card"},
      h("div",{class:"section-label"},"Booked hours — " + cfg.pool + ", season " + cfg.season),
      h("div",{class:"scroll-x"}, sched),
      h("div",{class:"pool-note"},
        "EUR " + (cfg.laneRateCents/100).toFixed(2).replace(".",",") + " per lane per hour" +
        (vat ? ", plus " + vat + "% btw" : ", excl. btw (contract tariff)") +
        " · " + fmtDate(cfg.start) + " – " + fmtDate(cfg.end) +
        (refs.length ? " · reservations " + refs.map(function(r){ return "#" + r; }).join(", ") : "") + ".")));

    // ---- month by month ----
    var body = plan.months.map(function(m){
      var est = poolGross(m.netCents, cfg);
      var act = actual[m.ym] || 0;
      var diff = act - est;
      return h("tr",{class: m.ym === thisYm ? "now" : ""},
        h("td",null, monthLabel(m.ym)),
        dows.map(function(d){ return h("td",{class:"col-detail"}, m.perDow[d] ? String(m.perDow[d]) : "·"); }),
        h("td",{class:"col-detail"}, String(m.hours)),
        h("td",null, fmtEUR(est)),
        h("td",{class: act ? "" : "muted"}, act ? fmtEUR(act) : "—"),
        h("td",{class: !act ? "muted" : (diff > 0 ? "amt-neg" : diff < 0 ? "amt-pos" : "")},
          act ? (diff > 0 ? "+" : "") + fmtEUR(diff) : "—"));
    });
    var tbl = h("table",{class:"pl-table pool-table"},
      h("thead",null,h("tr",null,
        h("th",null,"Month"),
        dows.map(function(d){ return h("th",{class:"col-detail"}, DOW_SHORT[d]); }),
        h("th",{class:"col-detail"},"Hours"),
        h("th",null,"Estimate"),
        h("th",null,"Invoiced"),
        h("th",null,"Diff"))),
      h("tbody",null, body,
        h("tr",{class:"total"},
          h("td",null,"Season"),
          dows.map(function(d){
            var n = plan.months.reduce(function(s,m){ return s + (m.perDow[d] || 0); }, 0);
            return h("td",{class:"col-detail"}, String(n));
          }),
          h("td",{class:"col-detail"}, String(plan.totalHours)),
          h("td",null, fmtEUR(seasonGross)),
          h("td",{class: invoiced ? "" : "muted"}, invoiced ? fmtEUR(invoiced) : "—"),
          h("td",null,""))
      ));
    APP.append(h("div",{class:"card"},
      h("div",{class:"section-label"},"What the pool costs each month — season " + cfg.season),
      h("div",{class:"scroll-x"}, tbl),
      noteToggle("How to read this", [
        "\"Estimate\" is the contract price for the sessions actually swum that month.",
        "\"Invoiced\" is what Friendship billed for that month — the month the invoice covers, " +
        "not when it was paid. Bills arrive 1–3 months late, so recent months read \"—\" until " +
        "the invoice lands."
      ])));

    APP.append(h("div",{class:"card"},
      h("div",{class:"section-label"},"Estimate vs invoiced"),
      h("div",{class:"chart-box tall"}, h("canvas",{id:"chart-pool"}))));

    // ---- days we don't pay for ----
    if (plan.skipped.length){
      var saved = plan.skipped.reduce(function(s,x){ return s + poolGross(x.savedCents, cfg); }, 0);
      APP.append(h("div",{class:"card"},
        h("div",{class:"section-label"},"Sessions that fall away — " + fmtEUR(saved) + " not charged"),
        h("div",{class:"pool-skip"},
          plan.skipped.map(function(x){
            return h("span",{class:"badge" + (x.kind === "break" ? "" : " warn")},
              DOW_SHORT[x.dow] + " " + fmtDate(x.date) + " · " + x.why);
          })),
        h("div",{class:"pool-note"},
          "School holidays are swum through; only the Christmas break and the centre's closing " +
          "days drop out.")));
    }

    APP.append(renderPoolEditor(cfg));

    // ---- chart ----
    renderChart("chart-pool", {
      type: "bar",
      data: {
        labels: plan.months.map(function(m){ return monthLabel(m.ym); }),
        datasets: [
          { label:"Estimate", data: plan.months.map(function(m){ return poolGross(m.netCents, cfg) / 100; }),
            backgroundColor: VIZ.expense, borderRadius:4, categoryPercentage:.72, barPercentage:.9 },
          { label:"Invoiced", data: plan.months.map(function(m){ return (actual[m.ym] || 0) / 100; }),
            backgroundColor: VIZ.muted, borderRadius:4, categoryPercentage:.72, barPercentage:.9 }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        interaction:{ mode:"index", intersect:false },
        plugins:{ legend:{ position:"bottom", labels:{ color:VIZ.text, usePointStyle:true, boxWidth:8 } },
                  tooltip: tooltipEUR },
        scales: baseScales(true)
      }
    });
  }

  function renderPoolEditor(cfg){

        poolEditing ? "Close" : "Adjust")));

      card.append(h("div",{class:"small muted"},

      var hours = h("input",{type:"number",class:"small",min:"0",step:"0.5",value:String(s.hours),style:{width:"68px"}});

    var fBreaks = h("textarea",{rows:"3",style:{width:"100%"},
      placeholder:"2026-12-19..2027-01-03  Kerstvakantie"}, poolBreaksToText(cfg.breaks));
    var fClosed = h("textarea",{rows:"6",style:{width:"100%"},

    card.append(h("div",{class:"tiny muted"},"One per line: YYYY-MM-DD  label"));
    card.append(fClosed);

    card.append(h("div",{class:"poolrow"},
      h("button",{class:"primary", onclick:function(){
        var rate = parseUserAmount(fRate.value);
        poolCfg = {
          season: cfg.season, pool: cfg.pool,
          start: fStart.value || cfg.start,
          end:   fEnd.value   || cfg.end,
          laneRateCents: rate == null ? cfg.laneRateCents : rate,
          vatPct: Number(fVat.value) || 0,
          slots: slotRows.map(function(r){
            return { dow:Number(r.dsel.value), time:r.time.value.trim(),
                     lanes:Number(r.lanes.value) || 0, hours:Number(r.hours.value) || 0, ref:r.ref };
          }),
          breaks: poolTextToBreaks(fBreaks.value),

        };

        resetPoolCfg();
